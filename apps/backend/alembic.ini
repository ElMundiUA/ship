# Ship — Alembic configuration.
# The runtime URL is injected by env.py — either from
# ``backend.app.core.config.Settings`` (default path) or from a caller
# that explicitly sets ``cfg.set_main_option("sqlalchemy.url", ...)``
# (the pytest fixture in ``backend/tests/db_conftest.py`` does this).
# The static value here is intentionally empty so env.py can treat
# "ini provided nothing" as "fall back to Settings".

[alembic]
# ``%(here)s`` is alembic.ini's directory, so this resolves correctly
# whether you invoke from repo root (``alembic -c apps/backend/alembic.ini``)
# or from inside the container (where PYTHONPATH=/app/apps already adds
# the parent dir for ``import backend.app``).
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
