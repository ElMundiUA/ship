[pytest]
testpaths = tests
# Pre-existing rot — these test modules reference symbols that were
# removed during E14/E16/E17 refactors (Navigator email tool retired,
# decomposition specialists collapsed into the planning bundle, the
# legacy consult_specialist / find_or_create_project_by_name path is
# gone). Until the test files are rewritten against the current
# surface they stay deselected so CI can stay green on the rest.
# Track cleanup in a separate PR per cluster — don't just delete,
# many of these have valuable scenarios that still apply once the
# imports are repointed at current module names.
addopts =
    -ra
    --ignore-glob=**/test_agent_tools_inbox_and_routing.py
    --ignore-glob=**/test_artifact_check.py
    --ignore-glob=**/test_consult_specialist.py
    --ignore-glob=**/test_decomposition_role_modes.py
    --ignore-glob=**/test_default_bundle.py
    --ignore-glob=**/test_distiller_pr_webhook.py
    --ignore-glob=**/test_inbox_profiles.py
    --ignore-glob=**/test_navigator_email_tool.py
    --ignore-glob=**/test_navigator_mutating_tools.py
    --ignore-glob=**/test_navigator_readonly_tools.py
    --ignore-glob=**/test_role_prompts_no_stale_tools.py
    --ignore-glob=**/test_services_seed_bundle.py
    --ignore-glob=**/test_v1_workspace_artifacts.py
asyncio_mode = auto
# Per-test fixtures by default. The v1 Postgres fixtures use NullPool so
# every test gets a fresh asyncpg connection in its own loop (RFC-0006).
asyncio_default_fixture_loop_scope = function
