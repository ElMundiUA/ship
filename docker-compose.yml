  #       - CMD-SHELL
  #       - >
  #         node -e "require('http').get('http://localhost:3001/login',
  #         r => process.exit(r.statusCode < 500 ? 0 : 1))
  #         .on('error', () => process.exit(1))"
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s

  ship-worker:
    # The worker is opt-in via `docker compose --profile worker up`. Cloud
    # SaaS topology has no worker container after the pilot pivot — secret
    # probes run inline on save and the legacy git-sync cron is gone. We keep
    # the service definition for self-hosted operators who still want the
    # full local stack.
    build:
      context: .
      dockerfile: infra/deploy/backend/Dockerfile
    restart: unless-stopped
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ship-server:
        # Worker uses the same schema; let the server run alembic first so
        # we don't race on DDL. SHIP_SKIP_MIGRATIONS=1 below keeps the
        # worker out of alembic permanently.
        condition: service_healthy
    command: ["arq", "backend.app.workers.main.WorkerSettings"]
    environment:
      # Server runs migrations; worker should not race on them.
      SHIP_SKIP_MIGRATIONS: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ship}:${POSTGRES_PASSWORD:-ship}@postgres:5432/${POSTGRES_DB:-ship}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ship-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-shipminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-shipminio}
      S3_REGION: ${S3_REGION:-us-east-1}
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-for-prod-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SHIP_AUTH_MODE: ${SHIP_AUTH_MODE:-local}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      SENTRY_SERVICE_NAME: ship-worker
      SHIP_VERSION: ${SHIP_VERSION:-}
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./documentation:/app/documentation:ro
      - ./README.md:/app/README.md:ro
      - ./VERSION:/app/VERSION:ro

volumes:
  postgres_data:
  minio_data:
