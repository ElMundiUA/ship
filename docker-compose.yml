# Ship cloud platform — local stack (RFC-0006).
#
# One command brings up the lean backend on a developer laptop (matches the
# cloud SaaS topology: Postgres + MinIO + API + console — no worker, no Redis):
#
#   cp .env.example .env
#   docker compose up
#
# Opt into the legacy ARQ worker + Redis with the `worker` profile when you
# need background jobs locally:
#
#   docker compose --profile worker up
#
# Same image set is what runs in self-hosted Helm and (against Neon + S3 in
# our SaaS) on Bunny Magic Containers.

name: ship

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ship}
      POSTGRES_DB: ${POSTGRES_DB:-ship}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/deploy/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ship} -d ${POSTGRES_DB:-ship}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Worker-only dependency. Cloud SaaS doesn't ship a worker container, so
    # redis stays behind the `worker` profile and only spins up when an
    # operator opts in with `docker compose --profile worker up`.
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["worker"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-shipminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-shipminio}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-shipminio} ${S3_SECRET_KEY:-shipminio} &&
      mc mb -p local/${S3_BUCKET:-ship-documents} &&
      mc anonymous set download local/${S3_BUCKET:-ship-documents} || true
      "
    restart: "no"

  ship-server:
    build:
      context: .
      dockerfile: infra/deploy/backend/Dockerfile
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8100", "--log-level", "info"]
    restart: unless-stopped
    # Resolve via public DNS, not the host resolver. Local/router DNS often
    # negative-caches freshly-created *.ondigitalocean.app subdomains, which
    # made the deploy health probe fail ("Name or service not known") on a
    # perfectly healthy app. Public resolvers see the new subdomain immediately.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ship}:${POSTGRES_PASSWORD:-ship}@postgres:5432/${POSTGRES_DB:-ship}?sslmode=disable
      ALEMBIC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ship}:${POSTGRES_PASSWORD:-ship}@postgres:5432/${POSTGRES_DB:-ship}?sslmode=disable
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ship-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-shipminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-shipminio}
      S3_REGION: ${S3_REGION:-us-east-1}
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-for-prod-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      SHIP_FEEDBACK_REPO: ${SHIP_FEEDBACK_REPO:-ElMundiUA/ship}
      SHIP_AUTH_MODE: ${SHIP_AUTH_MODE:-local}
      SHIP_ALLOW_LOCAL_AUTH0_CALLBACKS: ${SHIP_ALLOW_LOCAL_AUTH0_CALLBACKS:-}
      SHIP_PUBLIC_URL: ${SHIP_PUBLIC_URL:-http://localhost:8100}
      SHIP_CONSOLE_URL: ${SHIP_CONSOLE_URL:-http://localhost:3001}
      # Deploy feature — DigitalOcean OAuth (App Platform provider).
      DIGITALOCEAN_CLIENT_ID: ${DIGITALOCEAN_CLIENT_ID:-}
      DIGITALOCEAN_CLIENT_SECRET: ${DIGITALOCEAN_CLIENT_SECRET:-}
      DIGITALOCEAN_OAUTH_SCOPES: ${DIGITALOCEAN_OAUTH_SCOPES:-read write}
      DIGITALOCEAN_TOKEN_REFRESH_HOURS: ${DIGITALOCEAN_TOKEN_REFRESH_HOURS:-24}
      # Deploy planner LLM (prod uses OPENAI/ANTHROPIC above; the Gemini
      # fallback is local-dev only and stays off unless explicitly enabled).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Extra deploy-planner vendor — also powers the live model dropdown
      # in the New deployment modal (services.deploy.model_catalog).
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # Platform Cursor key — read-only, only to populate the per-stage
      # model dropdown for Cursor stages (Cursor has no keyless catalogue).
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      AGENT_VENDOR: ${AGENT_VENDOR:-openai}
      DEPLOY_PLANNER_GEMINI_API_KEY: ${DEPLOY_PLANNER_GEMINI_API_KEY:-}
      DEPLOY_PLANNER_GEMINI_MODEL: ${DEPLOY_PLANNER_GEMINI_MODEL:-gemini-2.5-flash}
      DEPLOY_PLANNER_ALLOW_DEV_FALLBACK: ${DEPLOY_PLANNER_ALLOW_DEV_FALLBACK:-false}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      SENTRY_SERVICE_NAME: ship-server
      SHIP_VERSION: ${SHIP_VERSION:-}
    ports:
      - "${SHIP_API_PORT:-8100}:8100"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./documentation:/app/documentation:ro
      - ./README.md:/app/README.md:ro
      - ./VERSION:/app/VERSION:ro
    healthcheck:
      # Readiness: v1/health round-trips Postgres so this only goes green
      # *after* alembic upgrade has completed and the DB is reachable.
      # `start_period` gives migrations time to run on cold boot.
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/v1/health"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 30s

  # console:
  #   # Commented out — run the frontend locally with `npm run dev` in apps/console.
  #   # Operator console (Next.js). The marketing landing is intentionally NOT
  #   # in compose — it stays on the public web and reads like any other site.
  #   # This service ships only the in-app operator UI.
  #   build:
  #     context: .
  #     dockerfile: infra/deploy/console/Dockerfile
  #   restart: unless-stopped
  #   depends_on:
