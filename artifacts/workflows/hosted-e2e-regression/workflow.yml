name: Ship · Hosted E2E regression
# Day-4 Phase-2 starter workflow for hosted Playwright/Cypress runs.

on:
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: "Ship pipeline_run id we should report against"
        required: true
      ship_callback_url:
        description: "URL Ship is listening on for the result callback"
        required: true
      ship_run_token:
        description: "Short-lived bearer token Ship issued for this run"
        required: true
      target_url:
        description: "Preview URL under test (optional, honoured by your runner)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shipctl
        run: npm install -g @elmundi/ship-cli@0.11.1

      - name: Run hosted E2E
        id: e2e
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          shipctl kickoff --pattern kickoff > /tmp/ship-kickoff.md || true
          if [ -z "$TARGET_URL" ]; then
            SUMMARY="Hosted E2E regression (starter stub — no target URL supplied)"
          else
            SUMMARY="Hosted E2E regression (starter stub against $TARGET_URL)"
          fi
          echo "status=succeeded" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Report back to Ship
        if: always() && inputs.ship_callback_url != ''
        env:
          SHIP_RUN_ID: ${{ inputs.ship_run_id }}
          SHIP_CALLBACK_URL: ${{ inputs.ship_callback_url }}
          SHIP_RUN_TOKEN: ${{ inputs.ship_run_token }}
          GATE_STATUS: ${{ steps.e2e.outputs.status || 'failed' }}
          GATE_SUMMARY: ${{ steps.e2e.outputs.summary || 'Hosted E2E failed before reporting' }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CB=failed
          if [ "$GATE_STATUS" = "succeeded" ]; then CB=ok; fi
          shipctl callback --status "$CB" \
            --summary "$GATE_SUMMARY" \
            --metric "gh_workflow_run_id=$GH_RUN_ID" \
            --metric "gh_html_url=$GH_RUN_URL"
