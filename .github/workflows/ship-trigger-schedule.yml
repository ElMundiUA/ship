name: Ship · Schedule trigger

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: ship-trigger-schedule-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shipctl
        run: npm install -g @elmundi/ship-cli@latest

      - name: Ask Ship which lanes are due
        env:
          SHIP_API_TOKEN: ${{ secrets.SHIP_API_TOKEN }}
          SHIP_WORKSPACE_API_BASE: ${{ secrets.SHIP_API_BASE }}
          SHIP_API_BASE: ${{ secrets.SHIP_API_BASE }}
          SHIP_REPO: ${{ github.repository }}
          SHIP_EVENT_NAME: ${{ github.event_name }}
          SHIP_REF: ${{ github.ref }}
          SHIP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shipctl trigger --event schedule --repo "$SHIP_REPO" --json > /tmp/ship-trigger.json
          jq -r '.due_routines[].routine_id' /tmp/ship-trigger.json > /tmp/ship-due-routines.txt
          if [ ! -s /tmp/ship-due-routines.txt ]; then
            echo "No Ship routines due in this tick."
            exit 0
          fi

          while IFS= read -r routine; do
            echo "::group::Ship routine ${routine}"
            SHIP_REPO="" shipctl run --routine "$routine" --trigger schedule
            echo "::endgroup::"
          done < /tmp/ship-due-routines.txt
