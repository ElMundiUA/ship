name: Ship · Schedule trigger

on:
  workflow_dispatch:
    inputs:
      routine_id:
        description: "FSM routine to fire directly (bypasses the cron picker). Leave blank for normal cron behavior."
        required: false
        type: string
      ticket_ref:
        description: "Pin the agent to this ticket (only used with routine_id). e.g. ELS-42"
        required: false
        type: string
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ship-trigger-schedule-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for agent introspection + branch push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shipctl + agent CLIs
        run: |
          npm install -g @elmundi/ship-cli@latest
          # All three runtimes are installed unconditionally; per-tick
          # ``shipctl run`` resolves the workspace's bound provider
          # from /v1/workspaces/{ws}/agent-provider and only spawns
          # one of them. Total install cost is small enough that
          # branching by provider would only save seconds.
          curl -fsS https://cursor.com/install | bash
          npm install -g @anthropic-ai/claude-code @openai/codex
          # Cursor agent installer drops binaries under ~/.local/bin
          # but doesn't always touch PATH for non-interactive shells.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/cursor-agent/versions" >> "$GITHUB_PATH"

      - name: Configure git committer identity
        run: |
          git config --global user.email "ship-agent@elmundi.com"
          git config --global user.name  "Ship Agent"

      - name: Compute next Ship action
        env:
          SHIP_API_TOKEN: ${{ secrets.SHIP_API_TOKEN }}
          SHIP_WORKSPACE_API_BASE: ${{ secrets.SHIP_API_BASE }}
          SHIP_API_BASE: ${{ secrets.SHIP_API_BASE }}
          SHIP_WORKSPACE_ID: ${{ secrets.SHIP_WORKSPACE_ID }}
          # All three runtime keys; only the bound one is consumed per
          # tick by the resolved adapter.
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ``gh pr create`` reads GH_TOKEN; the workflow's
          # ``pull-requests: write`` permission lets it open PRs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIP_REPO: ${{ github.repository }}
          SHIP_EVENT_NAME: ${{ github.event_name }}
          SHIP_REF: ${{ github.ref }}
          SHIP_SHA: ${{ github.sha }}
          MANUAL_ROUTINE: ${{ inputs.routine_id }}
          MANUAL_TICKET: ${{ inputs.ticket_ref }}
        run: |
          set -euo pipefail
          # Manual workflow_dispatch with a routine id bypasses the
          # cron picker — debug harness for "fire this stage now,
          # detailed log". ``--debug`` streams a per-step log so the
          # operator can see every phase interleaved with the agent
          # CLI's own output.
          if [ -n "$MANUAL_ROUTINE" ]; then
            echo "::group::Ship manual routine ${MANUAL_ROUTINE}${MANUAL_TICKET:+ ticket=$MANUAL_TICKET}"
            shipctl run --routine "$MANUAL_ROUTINE" --commit-and-pr --debug
            echo "::endgroup::"
            exit 0
          fi
          # Normal cron path. ``shipctl trigger`` returns *all* due
          # routines sorted drain-first (later SDLC stage outranks
          # earlier — see ``pipeline_priority``).
          #
          # We iterate the due list and run up to
          # ``SHIP_MAX_ACTIONS_PER_TICK`` (default 5) routines that
          # land work, NOT just the first. Two reasons:
          #
          #   1. GitHub throttles ``schedule:`` workflows during peak
          #      load — observed gaps of 4-8 hours between ticks in
          #      production. The old one-action-per-tick rule
          #      multiplied that latency by the number of stages
          #      remaining on the pipeline (an 8-hour cron gap × 5
          #      stages = 40 hours per ticket).
          #   2. A single tick that drains 4-5 actions fits in the
          #      runner's 30-min budget (≈4 min per agent invocation)
          #      and keeps the pipeline moving when cron itself is
          #      unreliable.
          #
          # ``noop`` rows are skipped fast (the routine has nothing
          # eligible). Each ``ok`` row counts toward the cap. A
          # genuine non-zero exit from ``shipctl run`` bubbles up
          # via ``set -e`` and stops the tick.
          MAX_ACTIONS_PER_TICK=${SHIP_MAX_ACTIONS_PER_TICK:-5}
          shipctl trigger --event schedule --repo "$SHIP_REPO" --pipeline-fallback --json > /tmp/ship-action.json
          jq '.due_routines[].routine_id' /tmp/ship-action.json | tr -d '"' > /tmp/ship-due-routines.txt || true
          ACTIONS_DONE=0
          if [ -s /tmp/ship-due-routines.txt ]; then
            while IFS= read -r ROUTINE; do
              [ -z "$ROUTINE" ] && continue
              if [ "$ACTIONS_DONE" -ge "$MAX_ACTIONS_PER_TICK" ]; then
                echo "Ship: hit MAX_ACTIONS_PER_TICK=$MAX_ACTIONS_PER_TICK; remaining routines wait for next cron."
                break
              fi
              echo "::group::Ship routine ${ROUTINE}"
              STATUS_FILE="/tmp/ship-status-${ROUTINE//\//_}.json"
              rm -f "$STATUS_FILE"
              SHIP_REPO="" shipctl run --routine "$ROUTINE" --trigger schedule --commit-and-pr --status-file "$STATUS_FILE"
              echo "::endgroup::"
              STATUS=$(jq -r '.status // "ok"' "$STATUS_FILE" 2>/dev/null || echo "ok")
              REASON=$(jq -r '.reason // ""' "$STATUS_FILE" 2>/dev/null || echo "")
              if [ "$STATUS" = "noop" ]; then
                echo "Ship: routine ${ROUTINE} noop (reason=${REASON}); trying next."
                continue
              fi
              echo "Ship: routine ${ROUTINE} did work (status=${STATUS}); continuing through due list."
              ACTIONS_DONE=$((ACTIONS_DONE + 1))
            done < /tmp/ship-due-routines.txt
          fi
          if [ "$ACTIONS_DONE" = "0" ]; then
            ACTION=$(jq -r '.next_action.kind // "noop"' /tmp/ship-action.json)
            if [ "$ACTION" = "pipeline_pick" ]; then
              SPECIALIST=$(jq -r '.next_action.specialist' /tmp/ship-action.json)
              echo "::group::Ship pipeline pick — ${SPECIALIST}"
              SHIP_REPO="" shipctl run --specialist "$SPECIALIST" --trigger pipeline_pick --commit-and-pr
              echo "::endgroup::"
            else
              echo "Ship: every due routine no-op'd and no pipeline pick available — nothing to do this tick."
            fi
          else
            echo "Ship: completed ${ACTIONS_DONE} action(s) this tick."
          fi
