# Playwright against a **deployed** dev/stage console + Ship API + optional GitHub sandbox.
# Secrets: E2E_CONSOLE_BASE_URL (required), optionally E2E_SHIP_* , E2E_GITHUB_TOKEN, E2E_PLAYWRIGHT_STORAGE_JSON

name: E2E console (Playwright)

on:
  workflow_dispatch:
  schedule:
    - cron: "42 6 * * *"

concurrency:
  group: e2e-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require E2E_CONSOLE_BASE_URL
        run: |
          if [ -z "${{ secrets.E2E_CONSOLE_BASE_URL }}" ]; then
            echo "::error::Add repository secret E2E_CONSOLE_BASE_URL (deployed console origin)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Write Playwright storage (optional, for @deployed journeys + wired)
        if: ${{ secrets.E2E_PLAYWRIGHT_STORAGE_JSON != '' }}
        working-directory: e2e
        env:
          STATE_JSON: ${{ secrets.E2E_PLAYWRIGHT_STORAGE_JSON }}
        run: |
          mkdir -p .auth
          printf '%s' "$STATE_JSON" > .auth/ci-storage.json

      - name: Run Playwright
        working-directory: e2e
        env:
          CI: "true"
          E2E_CONSOLE_BASE_URL: ${{ secrets.E2E_CONSOLE_BASE_URL }}
          E2E_SHIP_API_BASE: ${{ secrets.E2E_SHIP_API_BASE }}
          E2E_SHIP_API_TOKEN: ${{ secrets.E2E_SHIP_API_TOKEN }}
          E2E_WORKSPACE_ID: ${{ secrets.E2E_WORKSPACE_ID }}
          E2E_SANDBOX_REPO: ${{ secrets.E2E_SANDBOX_REPO }}
          GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_EXPECT_SHIP_CLARIFICATION_LABEL: ${{ secrets.E2E_EXPECT_SHIP_CLARIFICATION_LABEL }}
        run: |
          if [ -f .auth/ci-storage.json ]; then
            export E2E_STORAGE_STATE="$PWD/.auth/ci-storage.json"
          fi
          npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
