# Playwright against a **deployed** dev/stage console + Ship API + optional GitHub sandbox.
# Secrets: E2E_CONSOLE_BASE_URL (required), optionally E2E_SHIP_* , E2E_GITHUB_TOKEN, E2E_PLAYWRIGHT_STORAGE_JSON

name: E2E console (Playwright)

on:
  workflow_dispatch:
    inputs:
      run_full_journey:
        description: "Run the full onboarding journey spec (tests/full-journey.wired.spec.ts)"
        type: boolean
        default: false
      run_github_app_install:
        description: "Let the journey install Ship GitHub App via UI (requires github.com cookies in storage)"
        type: boolean
        default: false
      reset_sandbox:
        description: "Reset the sandbox repo + Ship workspace (destructive, runs only tests/full-journey-reset.sandbox.spec.ts)"
        type: boolean
        default: false
      preset:
        description: "Preset id to pick in the wizard when run_full_journey=true"
        type: choice
        default: "web-app"
        options:
          - web-app
          - api-backend
          - mobile-app
          - cli
          - monorepo
          - adoption-minimum
  schedule:
    - cron: "42 6 * * *"

concurrency:
  group: e2e-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require E2E_CONSOLE_BASE_URL
        run: |
          if [ -z "${{ secrets.E2E_CONSOLE_BASE_URL }}" ]; then
            echo "::error::Add repository secret E2E_CONSOLE_BASE_URL (deployed console origin)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Write Playwright storage (optional, for @deployed journeys + wired)
        # GitHub forbids ``secrets.*`` inside step-level ``if:`` expressions
        # (actionlint: "context \"secrets\" is not allowed here"). Silently
        # failing the workflow at parse-time produces 0-job "workflow file
        # issue" runs, which is what we had before this fix. Instead, always
        # enter the step and bail in bash when the secret is empty.
        working-directory: e2e
        env:
          STATE_JSON: ${{ secrets.E2E_PLAYWRIGHT_STORAGE_JSON }}
        run: |
          if [ -z "${STATE_JSON:-}" ]; then
            echo "E2E_PLAYWRIGHT_STORAGE_JSON not set — skipping storage state write."
            exit 0
          fi
          mkdir -p .auth
          printf '%s' "$STATE_JSON" > .auth/ci-storage.json

      - name: Run Playwright
        working-directory: e2e
        env:
          CI: "true"
          E2E_CONSOLE_BASE_URL: ${{ secrets.E2E_CONSOLE_BASE_URL }}
          E2E_SHIP_API_BASE: ${{ secrets.E2E_SHIP_API_BASE }}
          E2E_SHIP_API_TOKEN: ${{ secrets.E2E_SHIP_API_TOKEN }}
          E2E_WORKSPACE_ID: ${{ secrets.E2E_WORKSPACE_ID }}
          E2E_SANDBOX_REPO: ${{ secrets.E2E_SANDBOX_REPO }}
          GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_EXPECT_SHIP_CLARIFICATION_LABEL: ${{ secrets.E2E_EXPECT_SHIP_CLARIFICATION_LABEL }}
          E2E_GITHUB_INSTALL_ACCOUNT: ${{ secrets.E2E_GITHUB_INSTALL_ACCOUNT }}
          E2E_GITHUB_REPO_FULL_NAME: ${{ secrets.E2E_GITHUB_REPO_FULL_NAME }}
          E2E_GITHUB_USERNAME: ${{ secrets.E2E_GITHUB_USERNAME }}
          E2E_GITHUB_PASSWORD: ${{ secrets.E2E_GITHUB_PASSWORD }}
          E2E_RUN_FULL_JOURNEY: ${{ inputs.run_full_journey && '1' || '' }}
          E2E_RUN_GITHUB_APP_INSTALL: ${{ inputs.run_github_app_install && '1' || '' }}
          E2E_RESET_SANDBOX: ${{ inputs.reset_sandbox && '1' || '' }}
          E2E_PRESET: ${{ inputs.preset }}
        run: |
          if [ -f .auth/ci-storage.json ]; then
            export E2E_STORAGE_STATE="$PWD/.auth/ci-storage.json"
          fi
          if [ "${E2E_RESET_SANDBOX:-}" = "1" ]; then
            # Destructive path: run only the reset spec, skip the journey and the
            # rest of the suite so rollback never races with active tests.
            npx playwright test --project=sandbox-api tests/full-journey-reset.sandbox.spec.ts
          else
            npm test
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
