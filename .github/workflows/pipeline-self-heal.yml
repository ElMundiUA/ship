name: Ship · Pipeline self-heal
# Day-4 Phase-2 starter workflow for the `self_heal` pipeline kind.
# Intent: detect workflow/config drift (broken cron, stale secret
# names, starved runners) WITHOUT stealing the SDLC intake slot.
# Default cadence is 04:00 UTC so logs are legible and the schedule
# doesn't collide with the daily-standup lane.
#
# The starter body is a diagnostics stub — it records the runner's
# own metadata as evidence and reports green. Replace with a real
# probe (e.g. `shipctl doctor --json` or a bespoke lint of
# `.github/workflows/*.yml`) that can flip the status to `failed`
# when drift is detected.

on:
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: "Ship pipeline_run id we should report against"
        required: true
      ship_callback_url:
        description: "URL Ship is listening on for the result callback"
        required: true
      ship_run_token:
        description: "Short-lived bearer token Ship issued for this run"
        required: true
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  self_heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect diagnostics
        id: diag
        run: |
          set -euo pipefail
          WF_COUNT=$(find .github/workflows -type f -name '*.yml' 2>/dev/null | wc -l | tr -d ' ')
          echo "status=succeeded" >> "$GITHUB_OUTPUT"
          echo "summary=Self-heal diagnostics ran (${WF_COUNT} workflow(s) inspected)" >> "$GITHUB_OUTPUT"
          echo "workflows=$WF_COUNT" >> "$GITHUB_OUTPUT"

      - name: Report back to Ship
        if: always() && inputs.ship_callback_url != ''
        env:
          SHIP_RUN_ID: ${{ inputs.ship_run_id }}
          SHIP_CALLBACK_URL: ${{ inputs.ship_callback_url }}
          SHIP_RUN_TOKEN: ${{ inputs.ship_run_token }}
          GATE_STATUS: ${{ steps.diag.outputs.status || 'failed' }}
          GATE_SUMMARY: ${{ steps.diag.outputs.summary || 'Self-heal failed before reporting' }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_RUN_ID: ${{ github.run_id }}
          WORKFLOW_COUNT: ${{ steps.diag.outputs.workflows || 0 }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            -X POST "$SHIP_CALLBACK_URL" \
            -H "Authorization: Bearer $SHIP_RUN_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- <<JSON
          {
            "status": "$GATE_STATUS",
            "summary": "$GATE_SUMMARY",
            "metrics": {
              "gh_workflow_run_id": $GH_RUN_ID,
              "gh_html_url": "$GH_RUN_URL",
              "workflows_scanned": $WORKFLOW_COUNT
            }
          }
          JSON
