name: artifact-check

on:
  pull_request:
    paths:
      - "artifacts/**"
      - "scripts/ship_artifact_check.py"
      - ".github/workflows/artifact-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify artifact content hashes
        run: python3 scripts/ship_artifact_check.py
