# Publish @elmundi/ship-cli (cli/ workspace). Monorepo root stays private.
#
# Triggered by either:
#   - `v<x.y.z>`     — the unified Ship release tag (preferred; bumps every
#                       component in lockstep via scripts/version.mjs).
#   - `cli-v<x.y.z>` — legacy CLI-only tag, kept as an escape hatch in case
#                       we need to ship a CLI-only patch out of band.
#   - workflow_dispatch — manual run.
name: Publish @elmundi/ship-cli to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "cli-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Needed so `npm publish -w @elmundi/ship-cli` resolves workspaces from the repo root.
      - name: npm ci
        run: npm ci

      - name: Verify all components are at the same version
        run: node tools/scripts/version.mjs check

      - name: Verify tag matches canonical VERSION (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip either the unified `v` prefix or the legacy `cli-v` prefix.
          VER="${TAG#v}"
          VER="${VER#cli-v}"
          CANONICAL=$(cat VERSION | tr -d '[:space:]')
          if [[ "$VER" != "$CANONICAL" ]]; then
            echo "Tag $TAG does not match canonical VERSION $CANONICAL (expected v$CANONICAL or cli-v$CANONICAL)"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN secret is not set; cannot publish."
            exit 1
          fi
          # `--prefix cli` publishes the root workspace package (`ship`, private). Use `-w` instead.
          npm publish -w @elmundi/ship-cli --access public
