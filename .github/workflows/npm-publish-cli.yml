# Publish scoped package @ship/cli (cli/ only). Monorepo root stays private.
name: Publish @ship/cli to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches cli/package.json version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#cli-v}"
          PKG=$(node -p "require('./cli/package.json').version")
          if [[ "$VER" != "$PKG" ]]; then
            echo "Tag $TAG does not match cli/package.json version $PKG (expected cli-v$PKG)"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN secret is not set; cannot publish."
            exit 1
          fi
          npm publish --prefix cli --access public
