name: Docs (MkDocs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install doc dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build -q
