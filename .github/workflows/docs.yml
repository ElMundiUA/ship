# MkDocs validation on PRs only. Production deploy lives in docker-publish-bunny.yml (push main).
name: Ship docs (PR)

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install doc dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build -q
