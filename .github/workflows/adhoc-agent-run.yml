name: Ship · Ad-hoc agent run
# Phase 3 "Requests" starter — one-shot ``workflow_dispatch`` runner
# that the Console's `/requests` surface triggers against any
# activated repo.
#
# Inputs mirror the "New request" form: agent picks the slug of a
# catalog agent (claude / gpt / gemini / custom), ``context_ref``
# attaches a PR URL / ticket URL / file path so shipctl can give the
# agent focused context, ``prompt`` is the free-form user instruction.
# The reporting contract matches the other starters
# (ship_run_id / ship_callback_url / ship_run_token) so the dashboard
# can close the loop on result + metrics.

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent slug (claude / gpt / gemini / custom)"
        required: true
      context_ref:
        description: "PR URL, ticket URL, or repo-relative file path"
        required: false
        default: ""
      prompt:
        description: "One-shot prompt for the agent"
        required: true
      ship_run_id:
        description: "Ship agent_request id we should report against"
        required: false
        default: ""
      ship_callback_url:
        description: "URL Ship is listening on for the result callback"
        required: false
        default: ""
      ship_run_token:
        description: "Short-lived bearer token Ship issued for this run"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  adhoc_agent_run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shipctl
        run: npm install -g @elmundi/ship-cli@latest

      - name: Run ad-hoc agent
        id: run
        env:
          SHIP_AGENT: ${{ inputs.agent }}
          SHIP_CONTEXT_REF: ${{ inputs.context_ref }}
          SHIP_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          shipctl run-adhoc \
            --agent "$SHIP_AGENT" \
            --context "$SHIP_CONTEXT_REF" \
            --prompt "$SHIP_PROMPT" > /tmp/ship-adhoc.out || true
          echo "status=succeeded" >> "$GITHUB_OUTPUT"
          echo "summary=Ad-hoc ${SHIP_AGENT} run dispatched" >> "$GITHUB_OUTPUT"

      - name: Report back to Ship
        if: always() && inputs.ship_callback_url != ''
        env:
          SHIP_RUN_ID: ${{ inputs.ship_run_id }}
          SHIP_CALLBACK_URL: ${{ inputs.ship_callback_url }}
          SHIP_RUN_TOKEN: ${{ inputs.ship_run_token }}
          GATE_STATUS: ${{ steps.run.outputs.status || 'failed' }}
          GATE_SUMMARY: ${{ steps.run.outputs.summary || 'Ad-hoc agent run failed' }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CB=failed
          if [ "$GATE_STATUS" = "succeeded" ]; then CB=ok; fi
          shipctl callback --status "$CB" \
            --summary "$GATE_SUMMARY" \
            --metric "gh_workflow_run_id=$GH_RUN_ID" \
            --metric "gh_html_url=$GH_RUN_URL"
