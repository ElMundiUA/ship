# Build & push the Ship cloud platform Docker images (RFC-0006).
#
# Two images live in this repo:
#
#   dekus/ship-backend  — FastAPI (`ship-server`) + arq worker (`ship-worker`)
#                         share one image; the runtime command differs.
#                         Dockerfile: deploy/backend/Dockerfile
#   dekus/ship-console  — Next.js operator UI (standalone build).
#                         Dockerfile: deploy/console/Dockerfile
#
# The marketing landing image (`dekus/ship-docs`) is built by the sibling
# workflow `docker-publish-bunny.yml`. Keep these two pipelines independent
# so a slow console build never blocks a docs hotfix.
#
# Tagging:
#   - `latest`              — only on `main` pushes
#   - `sha-<7-char-sha>`    — every build (pinnable for Bunny Magic Containers)
#   - `pr-<number>`         — on pull_request, push=false (smoke build only)
#
# Bunny rollout: every `main` push (after a successful build) PATCHes the
# two Magic Container apps with the new `sha-<short>` tag + the registry
# digest, then polls until both rollouts report healthy. Required repo
# config:
#
#   secrets:
#     DOCKER_HUB_TOKEN          Docker Hub PAT with push perms
#     BUNNY_MAIN_API_KEY        Bunny account API key (Magic Containers RW)
#   vars (Settings → Variables → Actions, optional unless noted):
#     BUNNY_BACKEND_APP_ID      *required* — MC app id for ship-server
#     BUNNY_CONSOLE_APP_ID      *required* — MC app id for ship-console
#     BUNNY_BACKEND_CONTAINER   default "ship-server" — template name in the backend MC app
#     BUNNY_CONSOLE_CONTAINER   default "console"     — template name in the console MC app
#     BUNNY_WORKER_CONTAINER    leave empty for cloud SaaS (no worker)
#     DOCKERHUB_USERNAME        default "dekus"
#     DOCKER_IMAGE_NAME_BACKEND default "dekus/ship-backend"
#     DOCKER_IMAGE_NAME_CONSOLE default "dekus/ship-console"

name: Ship — platform images (backend + console)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "console/**"
      - "deploy/backend/**"
      - "deploy/console/**"
      - "requirements-backend.txt"
      - "VERSION"
      - ".github/workflows/docker-publish-platform.yml"
  pull_request:
    paths:
      - "backend/**"
      - "console/**"
      - "deploy/backend/**"
      - "deploy/console/**"
      - "requirements-backend.txt"
      - ".github/workflows/docker-publish-platform.yml"
  workflow_dispatch:

concurrency:
  # PRs cancel mid-flight; main pushes never do (we want every commit to
  # produce a registry tag for bisecting).
  group: ship-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Don't fail the whole pipeline if one image breaks — we want to know
      # which one is broken without re-running.
      fail-fast: false
      matrix:
        include:
          - name: backend
            image_default: dekus/ship-backend
            image_var: DOCKER_IMAGE_NAME_BACKEND
            dockerfile: ./deploy/backend/Dockerfile
            context: .
          - name: console
            image_default: dekus/ship-console
            image_var: DOCKER_IMAGE_NAME_CONSOLE
            dockerfile: ./deploy/console/Dockerfile
            context: .
    # Matrix outputs collide on the same key; we read the deploy tag from
    # GITHUB_SHA in the deploy job instead and fetch per-image digests from
    # Docker Hub there. Outputs left intentionally empty.
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: set-image
        env:
          OVERRIDE: ${{ vars[matrix.image_var] }}
          FALLBACK: ${{ matrix.image_default }}
        run: |
          IMG="${OVERRIDE:-$FALLBACK}"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve deploy tag (sha-<short>)
        id: deploy-tag
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Login is skipped on PRs — we only build to verify the Dockerfile,
      # never push from forks (would need write access to the registry).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dekus' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.set-image.outputs.image }}
          # `latest` only on main; `sha-<short>` always; `pr-<n>` for PR previews.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-

      - name: Build (and push on main / dispatch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # PR builds verify the Dockerfile but never push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope so backend and console don't trash each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Single arch on purpose — Bunny Magic Containers run linux/amd64.
          # Add arm64 here if/when we host on Graviton / Apple-silicon CI.
          platforms: linux/amd64

      - name: Summary
        if: always()
        env:
          IMG: ${{ steps.set-image.outputs.image }}
          TAG: ${{ steps.deploy-tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo "- Image: \`${IMG}\`"
            echo "- Deploy tag: \`${TAG}\`"
            if [[ -n "${DIGEST}" ]]; then echo "- Digest: \`${DIGEST}\`"; fi
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "- Pushed: **no** (PR build verifies Dockerfile only)"
            else
              echo "- Pushed: **yes** (\`latest\` + \`${TAG}\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-bunny:
    name: Roll out to Bunny Magic Containers
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve deploy tag (sha-<short>) + image names
        id: vars
        env:
          IMG_BACKEND: ${{ vars.DOCKER_IMAGE_NAME_BACKEND || 'dekus/ship-backend' }}
          IMG_CONSOLE: ${{ vars.DOCKER_IMAGE_NAME_CONSOLE || 'dekus/ship-console' }}
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "image_backend=${IMG_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "image_console=${IMG_CONSOLE}" >> "$GITHUB_OUTPUT"

      - name: Resolve registry digests (Docker Hub source-of-truth)
        id: digests
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          IMG_BACKEND: ${{ steps.vars.outputs.image_backend }}
          IMG_CONSOLE: ${{ steps.vars.outputs.image_console }}
        run: |
          set -euo pipefail
          fetch_digest() {
            local repo="$1"
            local token
            token="$(curl -sS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r .token)"
            [[ -n "$token" && "$token" != "null" ]]
            curl -sSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "https://registry-1.docker.io/v2/${repo}/manifests/${TAG}" \
              | grep -i '^docker-content-digest:' \
              | awk '{print $2}' \
              | tr -d '\r'
          }
          BACKEND_DIG="$(fetch_digest "${IMG_BACKEND}")"
          CONSOLE_DIG="$(fetch_digest "${IMG_CONSOLE}")"
          [[ -n "$BACKEND_DIG" && -n "$CONSOLE_DIG" ]]
          echo "backend=${BACKEND_DIG}" >> "$GITHUB_OUTPUT"
          echo "console=${CONSOLE_DIG}" >> "$GITHUB_OUTPUT"
          {
            echo "### Registry digests for ${TAG}"
            echo "- backend: \`${BACKEND_DIG}\`"
            echo "- console: \`${CONSOLE_DIG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Patch + roll out both Bunny apps
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_MAIN_API_KEY }}
          BUNNY_BACKEND_APP_ID: ${{ vars.BUNNY_BACKEND_APP_ID }}
          BUNNY_CONSOLE_APP_ID: ${{ vars.BUNNY_CONSOLE_APP_ID }}
          BUNNY_BACKEND_IMAGE: ${{ steps.vars.outputs.image_backend }}
          BUNNY_CONSOLE_IMAGE: ${{ steps.vars.outputs.image_console }}
          BUNNY_BACKEND_CONTAINER: ${{ vars.BUNNY_BACKEND_CONTAINER || 'ship-server' }}
          BUNNY_CONSOLE_CONTAINER: ${{ vars.BUNNY_CONSOLE_CONTAINER || 'console' }}
          BUNNY_WORKER_CONTAINER: ${{ vars.BUNNY_WORKER_CONTAINER }}
          BUNNY_BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          BUNNY_CONSOLE_DIGEST: ${{ steps.digests.outputs.console }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          # Best-effort observability only — bunny-deploy-platform's
          # waitForRollout no longer fails on this budget; it just stops
          # streaming progress and trusts the PATCH + deploy nudge. 90 s
          # is enough to catch a fast rollout in the log without burning
          # CI minutes.
          MAX_WAIT_S: "90"
        run: |
          set -euo pipefail
          if [[ -z "${BUNNY_BACKEND_APP_ID:-}" || -z "${BUNNY_CONSOLE_APP_ID:-}" ]]; then
            echo "::error::Set repo variables BUNNY_BACKEND_APP_ID + BUNNY_CONSOLE_APP_ID before enabling auto-deploy."
            echo "::error::Find the IDs in the Bunny dashboard URL: /magic-containers/<id>"
            exit 1
          fi
          if [[ -z "${BUNNY_ACCESS_KEY:-}" ]]; then
            echo "::error::Set repo secret BUNNY_MAIN_API_KEY (Bunny account API key with Magic Containers RW)."
            exit 1
          fi
          node scripts/bunny-deploy-platform.mjs

      - name: Deploy summary
        if: always()
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          {
            echo "### Bunny rollout"
            echo "- Tag: \`${TAG}\`"
            echo "- ship-server app: \`${{ vars.BUNNY_BACKEND_APP_ID || '(unset)' }}\`"
            echo "- ship-console app: \`${{ vars.BUNNY_CONSOLE_APP_ID || '(unset)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
