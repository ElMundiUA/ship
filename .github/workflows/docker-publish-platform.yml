# Build & push every Ship Docker image, then roll out to Bunny Magic Containers.
#
# Three images live in this repo and they are always built together so
# we never end up with a console expecting a backend that hasn't
# shipped yet (or a landing site that links to a feature the console
# hasn't deployed). Path filters were removed on purpose: any push to
# `main` rebuilds all three images so the `sha-<short>` tag is in lock-
# step across the whole platform.
#
#   dekus/ship-backend  — FastAPI (`ship-server`) + arq worker (`ship-worker`)
#                         share one image; the runtime command differs.
#                         Dockerfile: infra/deploy/backend/Dockerfile
#   dekus/ship-console  — Next.js operator UI (standalone build).
#                         Dockerfile: infra/deploy/console/Dockerfile
#   dekus/ship-docs     — Marketing landing + `/docs` manual + `/book`.
#                         Dockerfile: ./Dockerfile (repo root)
#
# Tagging:
#   - `latest`              — only on `main` pushes
#   - `sha-<7-char-sha>`    — every build (pinnable for Bunny Magic Containers)
#   - `pr-<number>`         — on pull_request, push=false (smoke build only)
#
# Bunny rollout: every `main` push (after a successful build) PATCHes the
# three Magic Container apps with the new `sha-<short>` tag + the
# registry digest, then triggers a deploy. Required repo config:
#
#   secrets:
#     DOCKER_HUB_TOKEN          Docker Hub PAT with push perms
#     BUNNY_MAIN_API_KEY        Bunny account API key (Magic Containers RW)
#   vars (Settings → Variables → Actions, optional unless noted):
#     BUNNY_BACKEND_APP_ID      *required* — MC app id for ship-server
#     BUNNY_CONSOLE_APP_ID      *required* — MC app id for ship-console
#     BUNNY_APP_ID              *required* — MC app id for ship-docs (landing)
#     SHIP_MC_APP_NAME          default "ship-docs" — MC app name for landing
#     BUNNY_BACKEND_CONTAINER   default "ship-server" — template name in the backend MC app
#     BUNNY_CONSOLE_CONTAINER   default "console"     — template name in the console MC app
#     BUNNY_CONTAINER_NAME      default "Container-1" — template name in the landing MC app
#     BUNNY_WORKER_CONTAINER    leave empty for cloud SaaS (no worker)
#     DOCKERHUB_USERNAME        default "dekus"
#     DOCKER_IMAGE_NAME_BACKEND default "dekus/ship-backend"
#     DOCKER_IMAGE_NAME_CONSOLE default "dekus/ship-console"
#     DOCKER_IMAGE_NAME         default "dekus/ship-docs"

name: Ship — platform images (backend + console + landing)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/backend/**"
      - "apps/console/**"
      - "apps/landing/**"
      - "documentation/**"
      - "infra/deploy/backend/**"
      - "infra/deploy/console/**"
      - "Dockerfile"
      - "requirements-backend.txt"
      - "package.json"
      - "package-lock.json"
      - "VERSION"
      - ".github/workflows/docker-publish-platform.yml"
  workflow_dispatch:

concurrency:
  # PRs cancel mid-flight; main pushes never do (we want every commit to
  # produce a registry tag for bisecting).
  group: ship-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Don't fail the whole pipeline if one image breaks — we want to know
      # which one is broken without re-running.
      fail-fast: false
      matrix:
        include:
          - name: backend
            image_default: dekus/ship-backend
            image_var: DOCKER_IMAGE_NAME_BACKEND
            dockerfile: ./infra/deploy/backend/Dockerfile
            context: .
          - name: console
            image_default: dekus/ship-console
            image_var: DOCKER_IMAGE_NAME_CONSOLE
            dockerfile: ./infra/deploy/console/Dockerfile
            context: .
          - name: landing
            image_default: dekus/ship-docs
            image_var: DOCKER_IMAGE_NAME
            dockerfile: ./Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: set-image
        env:
          OVERRIDE: ${{ vars[matrix.image_var] }}
          FALLBACK: ${{ matrix.image_default }}
        run: |
          IMG="${OVERRIDE:-$FALLBACK}"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve deploy tag (sha-<short>)
        id: deploy-tag
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Login is skipped on PRs — we only build to verify the Dockerfile,
      # never push from forks (would need write access to the registry).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dekus' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.set-image.outputs.image }}
          # `latest` only on main; `sha-<short>` always; `pr-<n>` for PR previews.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-

      - name: Build (and push on main / dispatch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # PR builds verify the Dockerfile but never push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope so backend/console/landing don't trash each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Single arch on purpose — Bunny Magic Containers run linux/amd64.
          # Add arm64 here if/when we host on Graviton / Apple-silicon CI.
          platforms: linux/amd64

      - name: Summary
        if: always()
        env:
          IMG: ${{ steps.set-image.outputs.image }}
          TAG: ${{ steps.deploy-tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo "- Image: \`${IMG}\`"
            echo "- Deploy tag: \`${TAG}\`"
            if [[ -n "${DIGEST}" ]]; then echo "- Digest: \`${DIGEST}\`"; fi
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "- Pushed: **no** (PR build verifies Dockerfile only)"
            else
              echo "- Pushed: **yes** (\`latest\` + \`${TAG}\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-platform:
    name: Roll out backend + console to Bunny Magic Containers
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve deploy tag (sha-<short>) + image names
        id: vars
        env:
          IMG_BACKEND: ${{ vars.DOCKER_IMAGE_NAME_BACKEND || 'dekus/ship-backend' }}
          IMG_CONSOLE: ${{ vars.DOCKER_IMAGE_NAME_CONSOLE || 'dekus/ship-console' }}
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "image_backend=${IMG_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "image_console=${IMG_CONSOLE}" >> "$GITHUB_OUTPUT"

      - name: Resolve registry digests (Docker Hub source-of-truth)
        id: digests
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          IMG_BACKEND: ${{ steps.vars.outputs.image_backend }}
          IMG_CONSOLE: ${{ steps.vars.outputs.image_console }}
        run: |
          set -euo pipefail
          fetch_digest() {
            local repo="$1"
            local token
            token="$(curl -sS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r .token)"
            [[ -n "$token" && "$token" != "null" ]]
            curl -sSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "https://registry-1.docker.io/v2/${repo}/manifests/${TAG}" \
              | grep -i '^docker-content-digest:' \
              | awk '{print $2}' \
              | tr -d '\r'
          }
          BACKEND_DIG="$(fetch_digest "${IMG_BACKEND}")"
          CONSOLE_DIG="$(fetch_digest "${IMG_CONSOLE}")"
          [[ -n "$BACKEND_DIG" && -n "$CONSOLE_DIG" ]]
          echo "backend=${BACKEND_DIG}" >> "$GITHUB_OUTPUT"
          echo "console=${CONSOLE_DIG}" >> "$GITHUB_OUTPUT"
          {
            echo "### Registry digests for ${TAG}"
            echo "- backend: \`${BACKEND_DIG}\`"
            echo "- console: \`${CONSOLE_DIG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Patch + roll out backend & console Bunny apps
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_MAIN_API_KEY }}
          BUNNY_BACKEND_APP_ID: ${{ vars.BUNNY_BACKEND_APP_ID }}
          BUNNY_CONSOLE_APP_ID: ${{ vars.BUNNY_CONSOLE_APP_ID }}
          BUNNY_BACKEND_IMAGE: ${{ steps.vars.outputs.image_backend }}
          BUNNY_CONSOLE_IMAGE: ${{ steps.vars.outputs.image_console }}
          BUNNY_BACKEND_CONTAINER: ${{ vars.BUNNY_BACKEND_CONTAINER || 'ship-server' }}
          BUNNY_CONSOLE_CONTAINER: ${{ vars.BUNNY_CONSOLE_CONTAINER || 'console' }}
          BUNNY_WORKER_CONTAINER: ${{ vars.BUNNY_WORKER_CONTAINER }}
          BUNNY_BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          BUNNY_CONSOLE_DIGEST: ${{ steps.digests.outputs.console }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          # Best-effort observability only — bunny-deploy-platform's
          # waitForRollout no longer fails on this budget; it just stops
          # streaming progress and trusts the PATCH + deploy nudge. 90 s
          # is enough to catch a fast rollout in the log without burning
          # CI minutes.
          MAX_WAIT_S: "90"
        run: |
          set -euo pipefail
          if [[ -z "${BUNNY_BACKEND_APP_ID:-}" || -z "${BUNNY_CONSOLE_APP_ID:-}" ]]; then
            echo "::error::Set repo variables BUNNY_BACKEND_APP_ID + BUNNY_CONSOLE_APP_ID before enabling auto-deploy."
            echo "::error::Find the IDs in the Bunny dashboard URL: /magic-containers/<id>"
            exit 1
          fi
          if [[ -z "${BUNNY_ACCESS_KEY:-}" ]]; then
            echo "::error::Set repo secret BUNNY_MAIN_API_KEY (Bunny account API key with Magic Containers RW)."
            exit 1
          fi
          node tools/scripts/bunny-deploy-platform.mjs

      - name: Deploy summary
        if: always()
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          {
            echo "### Bunny rollout (platform)"
            echo "- Tag: \`${TAG}\`"
            echo "- ship-server app: \`${{ vars.BUNNY_BACKEND_APP_ID || '(unset)' }}\`"
            echo "- ship-console app: \`${{ vars.BUNNY_CONSOLE_APP_ID || '(unset)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-landing:
    name: Roll out landing (ship-docs) to Bunny Magic Containers
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve deploy tag + image
        id: vars
        env:
          IMG: ${{ vars.DOCKER_IMAGE_NAME || 'dekus/ship-docs' }}
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"

      - name: Ensure Magic Container application exists
        id: mc
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_MAIN_API_KEY }}
          BUNNY_ACCESS_KEY_FALLBACK: ${{ secrets.BUNNYNET_API_KEY }}
          BUNNY_APP_ID: ${{ vars.BUNNY_APP_ID }}
          SHIP_MC_APP_NAME: ${{ vars.SHIP_MC_APP_NAME || 'ship-docs' }}
          DOCKER_IMAGE_NAME: ${{ steps.vars.outputs.image }}
          MC_CONTAINER_NAME: ${{ vars.BUNNY_CONTAINER_NAME || 'Container-1' }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: node tools/scripts/bunny-ship-docs.mjs ensure

      # Digest from the build can differ from what Docker Hub serves (manifest list,
      # timing). Bunny compares registry digest to the template — same tag +
      # different digest ⇒ orange "Apply update".
      - name: Resolve image digest from Docker Hub (source of truth for Bunny)
        id: hub_digest
        env:
          REPO: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          TOKEN="$(curl -sS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull" | jq -r .token)"
          [[ -n "$TOKEN" && "$TOKEN" != "null" ]]
          DIG="$(curl -sSI \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry-1.docker.io/v2/${REPO}/manifests/${TAG}" \
            | grep -i '^docker-content-digest:' | awk '{print $2}' | tr -d '\r')"
          [[ -n "$DIG" ]]
          echo "Registry digest for ${REPO}:${TAG} → ${DIG}"
          echo "digest=${DIG}" >> "$GITHUB_OUTPUT"

      - name: Patch container image (await Bunny API)
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_MAIN_API_KEY }}
          BUNNY_ACCESS_KEY_FALLBACK: ${{ secrets.BUNNYNET_API_KEY }}
          BUNNY_APP_ID: ${{ steps.mc.outputs.app_id }}
          MC_CONTAINER_NAME: ${{ steps.mc.outputs.mc_container_name }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.hub_digest.outputs.digest }}
        run: node tools/scripts/bunny-patch-container.mjs

      - name: Trigger Magic Container deploy (rollout)
        env:
          APP_ID: ${{ steps.mc.outputs.app_id }}
        run: |
          set -euo pipefail
          KEY='${{ secrets.BUNNY_MAIN_API_KEY }}'
          if [[ -z "${KEY}" ]]; then KEY='${{ secrets.BUNNYNET_API_KEY }}'; fi
          if [[ -z "${KEY}" ]]; then
            echo "::error::Set repository secret BUNNY_MAIN_API_KEY (or BUNNYNET_API_KEY) for Bunny Magic Containers."
            exit 1
          fi
          code="$(curl -sS -o /tmp/deploy.body -w "%{http_code}" \
            -X POST "https://api.bunny.net/mc/apps/${APP_ID}/deploy" \
            -H "Accept: application/json" \
            -H "AccessKey: ${KEY}")"
          echo "POST /mc/apps/${APP_ID}/deploy → HTTP ${code}"
          if [[ "${code}" != "200" ]]; then
            echo "::error::Bunny deploy failed. Body:"; cat /tmp/deploy.body || true
            exit 1
          fi
          echo "Bunny deploy triggered OK." >> "$GITHUB_STEP_SUMMARY"

      - name: Landing deploy summary
        if: always()
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          {
            echo "### Bunny rollout (landing)"
            echo "- Tag: \`${TAG}\`"
            echo "- ship-docs app: \`${{ steps.mc.outputs.app_id || '(unset)' }}\`"
            echo "- Default host: \`${{ steps.mc.outputs.bunny_default_host || '(n/a)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
