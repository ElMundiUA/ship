name: Docker publish & Bunny deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override in repo Variables → DOCKER_IMAGE_NAME (e.g. youruser/ship-docs)
  DOCKER_IMAGE_NAME: dekus/ship-docs

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: set-image
        run: |
          IMG="${{ vars.DOCKER_IMAGE_NAME }}"
          if [[ -z "${IMG}" ]]; then IMG="${{ env.DOCKER_IMAGE_NAME }}"; fi
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dekus' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.set-image.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-bunny:
    name: Update Bunny Magic Container
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ship-docs
    steps:
      - name: Deploy image to Bunny
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNY_APP_ID }}
          api_key: ${{ secrets.BUNNY_MAIN_API_KEY || secrets.BUNNYNET_API_KEY }}
          container: ${{ vars.BUNNY_CONTAINER_NAME || 'ship' }}
          image_tag: latest
