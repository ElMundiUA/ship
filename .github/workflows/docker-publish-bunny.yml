# Full pipeline: Docker image → Docker Hub → Bunny Magic Containers (this is the deploy you want on main).
name: Ship — Docker Hub + Bunny deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-docker-${{ github.ref }}
  # Do not cancel mid-flight: a newer push could skip Bunny if the deploy job never ran.
  cancel-in-progress: false

env:
  DOCKER_IMAGE_NAME: dekus/ship-docs

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: set-image
        run: |
          IMG="${{ vars.DOCKER_IMAGE_NAME }}"
          if [[ -z "${IMG}" ]]; then IMG="${{ env.DOCKER_IMAGE_NAME }}"; fi
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dekus' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.set-image.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-bunny:
    name: Ensure MC app & deploy image
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Optional: attach GitHub Environment "ship-docs" for protection rules — then duplicate secrets there.
    steps:
      - uses: actions/checkout@v4

      - name: Note (read this if you only saw "docs" green before)
        run: |
          {
            echo "### Bunny deploy"
            echo "Deploy runs **only in this workflow** (Ship — Docker Hub + Bunny deploy), job **Ensure MC app & deploy image**."
            echo "The separate **Ship docs (PR)** workflow only runs \`mkdocs build\` on pull requests — it never touches Bunny."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure Magic Container application exists
        id: mc
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_MAIN_API_KEY }}
          BUNNY_ACCESS_KEY_FALLBACK: ${{ secrets.BUNNYNET_API_KEY }}
          BUNNY_APP_ID: ${{ vars.BUNNY_APP_ID }}
          SHIP_MC_APP_NAME: ${{ vars.SHIP_MC_APP_NAME || 'ship-docs' }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'dekus/ship-docs' }}
          MC_CONTAINER_NAME: ${{ vars.BUNNY_CONTAINER_NAME || 'ship' }}
          IMAGE_TAG: latest
        run: node scripts/bunny-ship-docs.mjs ensure

      - name: Point container at new image (Bunny action)
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ steps.mc.outputs.app_id }}
          api_key: ${{ secrets.BUNNY_MAIN_API_KEY || secrets.BUNNYNET_API_KEY }}
          container: ${{ vars.BUNNY_CONTAINER_NAME || 'ship' }}
          image_tag: latest

      # PATCH image tag alone may not roll pods; elmundi also hits deploy in scripts.
      - name: Trigger Magic Container deploy (rollout)
        env:
          APP_ID: ${{ steps.mc.outputs.app_id }}
        run: |
          set -euo pipefail
          KEY='${{ secrets.BUNNY_MAIN_API_KEY }}'
          if [[ -z "${KEY}" ]]; then KEY='${{ secrets.BUNNYNET_API_KEY }}'; fi
          if [[ -z "${KEY}" ]]; then
            echo "::error::Set repository secret BUNNY_MAIN_API_KEY (or BUNNYNET_API_KEY) for Bunny Magic Containers."
            exit 1
          fi
          code="$(curl -sS -o /tmp/deploy.body -w "%{http_code}" \
            -X POST "https://api.bunny.net/mc/apps/${APP_ID}/deploy" \
            -H "Accept: application/json" \
            -H "AccessKey: ${KEY}")"
          echo "POST /mc/apps/${APP_ID}/deploy → HTTP ${code}"
          if [[ "${code}" != "200" ]]; then
            echo "::error::Bunny deploy failed. Body:"; cat /tmp/deploy.body || true
            exit 1
          fi
          echo "Bunny deploy triggered OK." >> "$GITHUB_STEP_SUMMARY"

      - name: DNS — what to configure for ship.elmundi.com
        run: |
          HOST="${{ steps.mc.outputs.bunny_default_host }}"
          {
            echo "## Bunny hostname"
            echo "Default app host: **\`$HOST\`** (HTTPS)."
            echo ""
            echo "### Custom domain **ship.elmundi.com**"
            echo "1. Bunny dashboard → **Magic Containers** → **${{ vars.SHIP_MC_APP_NAME || 'ship-docs' }}** → your **CDN / HTTP endpoint** → **Custom hostnames** → add **ship.elmundi.com**."
            echo "2. Bunny will show a **DNS target** (often a **CNAME** to a \`*.bunny.net\` / CDN hostname — not always the same string as the default mc host)."
            echo "3. At your DNS provider for **elmundi.com**, create:"
            echo "   - **Type:** \`CNAME\`"
            echo "   - **Name / host:** \`ship\`"
            echo "   - **Target / value:** exactly what Bunny shows for that custom hostname (copy-paste)."
            echo "4. Wait for TLS + propagation; MkDocs \`site_url\` is already \`https://ship.elmundi.com/\`."
          } >> "$GITHUB_STEP_SUMMARY"
