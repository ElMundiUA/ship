# Full pipeline: Docker image → Docker Hub → Bunny Magic Containers (this is the deploy you want on main).
name: Ship — Docker Hub + Bunny deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-docker-${{ github.ref }}
  # Do not cancel mid-flight: a newer push could skip Bunny if the deploy job never ran.
  cancel-in-progress: false

env:
  DOCKER_IMAGE_NAME: dekus/ship-docs

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.set-image.outputs.image }}
      # Immutable tag for Bunny (matches docker/metadata type=sha prefix=sha- format=short)
      deploy_image_tag: ${{ steps.deploy-tag.outputs.tag }}
      # Pin manifest so MC pulls the image Bunny just saw pushed (PatchContainerRequest.imageDigest)
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: set-image
        run: |
          IMG="${{ vars.DOCKER_IMAGE_NAME }}"
          if [[ -z "${IMG}" ]]; then IMG="${{ env.DOCKER_IMAGE_NAME }}"; fi
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dekus' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.set-image.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Resolve deploy tag (SHA, not latest)
        id: deploy-tag
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "Bunny will deploy **sha-${short}** (same tag pushed to the registry)." >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-bunny:
    name: Ensure MC app & deploy image
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Optional: attach GitHub Environment "ship-docs" for protection rules — then duplicate secrets there.
    steps:
      - uses: actions/checkout@v4

      - name: Note (read this if you only saw "docs" green before)
        run: |
          {
            echo "### Bunny deploy"
            echo "Deploy runs **only in this workflow** (Ship — Docker Hub + Bunny deploy), job **Ensure MC app & deploy image**."
            echo "Pull requests: run \`npm run landing:build\` locally or in CI if you add a check — Bunny deploy is only this workflow on \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure Magic Container application exists
        id: mc
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_MAIN_API_KEY }}
          BUNNY_ACCESS_KEY_FALLBACK: ${{ secrets.BUNNYNET_API_KEY }}
          BUNNY_APP_ID: ${{ vars.BUNNY_APP_ID }}
          SHIP_MC_APP_NAME: ${{ vars.SHIP_MC_APP_NAME || 'ship-docs' }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'dekus/ship-docs' }}
          MC_CONTAINER_NAME: ${{ vars.BUNNY_CONTAINER_NAME || 'Container-1' }}
          IMAGE_TAG: ${{ needs.build-push.outputs.deploy_image_tag }}
        run: node scripts/bunny-ship-docs.mjs ensure

      # Digest from the build can differ from what Docker Hub serves (manifest list, timing). Bunny
      # compares registry digest to the template — same tag + different digest ⇒ orange “Apply update”.
      - name: Resolve image digest from Docker Hub (source of truth for Bunny)
        id: hub_digest
        env:
          REPO: ${{ needs.build-push.outputs.image }}
          TAG: ${{ needs.build-push.outputs.deploy_image_tag }}
        run: |
          set -euo pipefail
          TOKEN="$(curl -sS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull" | jq -r .token)"
          [[ -n "$TOKEN" && "$TOKEN" != "null" ]]
          # Accept OCI index or Docker manifest v2 (multi-arch images)
          DIG="$(curl -sSI \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry-1.docker.io/v2/${REPO}/manifests/${TAG}" \
            | grep -i '^docker-content-digest:' | awk '{print $2}' | tr -d '\r')"
          [[ -n "$DIG" ]]
          echo "Registry digest for ${REPO}:${TAG} → ${DIG}"
          echo "digest=${DIG}" >> "$GITHUB_OUTPUT"

      # PATCH tag + digest (+ pull always) per
      # https://docs.bunny.net/api-reference/magic-containers/containers/patch-container-template
      - name: Patch container image (await Bunny API)
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_MAIN_API_KEY }}
          BUNNY_ACCESS_KEY_FALLBACK: ${{ secrets.BUNNYNET_API_KEY }}
          BUNNY_APP_ID: ${{ steps.mc.outputs.app_id }}
          MC_CONTAINER_NAME: ${{ steps.mc.outputs.mc_container_name }}
          IMAGE_TAG: ${{ needs.build-push.outputs.deploy_image_tag }}
          IMAGE_DIGEST: ${{ steps.hub_digest.outputs.digest || needs.build-push.outputs.image_digest }}
        run: node scripts/bunny-patch-container.mjs

      # Optional second nudge after config is saved (initial deploy / some accounts).
      - name: Trigger Magic Container deploy (rollout)
        env:
          APP_ID: ${{ steps.mc.outputs.app_id }}
        run: |
          set -euo pipefail
          KEY='${{ secrets.BUNNY_MAIN_API_KEY }}'
          if [[ -z "${KEY}" ]]; then KEY='${{ secrets.BUNNYNET_API_KEY }}'; fi
          if [[ -z "${KEY}" ]]; then
            echo "::error::Set repository secret BUNNY_MAIN_API_KEY (or BUNNYNET_API_KEY) for Bunny Magic Containers."
            exit 1
          fi
          code="$(curl -sS -o /tmp/deploy.body -w "%{http_code}" \
            -X POST "https://api.bunny.net/mc/apps/${APP_ID}/deploy" \
            -H "Accept: application/json" \
            -H "AccessKey: ${KEY}")"
          echo "POST /mc/apps/${APP_ID}/deploy → HTTP ${code}"
          if [[ "${code}" != "200" ]]; then
            echo "::error::Bunny deploy failed. Body:"; cat /tmp/deploy.body || true
            exit 1
          fi
          echo "Bunny deploy triggered OK." >> "$GITHUB_STEP_SUMMARY"

      - name: DNS — custom hostname (optional)
        run: |
          HOST="${{ steps.mc.outputs.bunny_default_host }}"
          CUSTOM="${{ vars.SHIP_DOCS_CUSTOM_HOST }}"
          ZONE="${{ vars.SHIP_DOCS_DNS_ZONE }}"
          {
            echo "## Bunny hostname"
            echo "Default app host: **\`$HOST\`** (HTTPS)."
            echo ""
            if [[ -n "${CUSTOM}" ]]; then
              echo "### Custom domain **${CUSTOM}**"
              echo "1. Bunny dashboard → **Magic Containers** → **${{ vars.SHIP_MC_APP_NAME || 'ship-docs' }}** → your **CDN / HTTP endpoint** → **Custom hostnames** → add **${CUSTOM}**."
              echo "2. Bunny will show a **DNS target** (often a **CNAME** — copy the value they display)."
              if [[ -n "${ZONE}" ]]; then
                echo "3. At your DNS provider for **${ZONE}**, create the record Bunny specifies (often a **CNAME** for the hostname prefix of **${CUSTOM}**)."
              else
                echo "3. At your DNS provider, create the record Bunny specifies for **${CUSTOM}**."
              fi
              echo "4. Wait for TLS + propagation; set **NEXT_PUBLIC_SITE_URL** (and public docs URL if split) to **https://${CUSTOM}/** for consistent metadata and links."
            else
              echo "### Custom domain"
              echo "Set GitHub repository variables **SHIP_DOCS_CUSTOM_HOST** (e.g. \`docs.example.com\`) and optionally **SHIP_DOCS_DNS_ZONE** (e.g. \`example.com\`) to print tailored CNAME steps here."
              echo "Until then, use Bunny’s UI for **Custom hostnames** and set the same origin in your deployment env (e.g. **NEXT_PUBLIC_SITE_URL**)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
