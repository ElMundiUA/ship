name: Ship · run-agent (reusable)
# RFC-0007 Phase 3 + RFC-0008 C3.2 — the single reusable workflow that
# every lane wrapper calls. A customer repo never copies this file;
# instead its generated thin wrapper (see `shipctl lanes install`) does:
#
#   jobs:
#     run:
#       uses: ElMundiUA/ship/.github/workflows/run-agent.yml@<ref>
#       with:
#         lane: pr_review
#       secrets: inherit
#
# The wrapper's sole responsibility is the `on:` block (cron / event /
# workflow_dispatch) and the lane id. Everything else — flag wiring,
# multi-pattern fan-out, idempotency, callback reporting — lives here.
#
# RFC-0008 C3.2 adds multi-pattern support:
#
#   lanes:
#     tech_debt_audit:
#       schedule: "0 6 * * 1"
#       patterns: [role-tech-architect, role-qa-architect, role-security-officer]
#       fanout: matrix  # default; alternatives: sequential | concurrent
#
# We resolve the lane's patterns list + fanout in a `plan` job, then
# fan out via a matrix strategy (one runner per pattern when
# fanout=matrix, one runner for the whole list otherwise). An
# `aggregate` job always runs, collects the matrix results, and sends
# a single callback to Ship. For the 99% case — a single-pattern lane —
# the matrix collapses to one entry and behaviour is identical to the
# pre-multi-pattern world.

on:
  workflow_call:
    inputs:
      lane:
        description: "Lane id as declared in .ship/config.yml"
        type: string
        required: true
      trigger:
        description: "Override trigger (once|event|schedule|manual). Defaults to github.event_name."
        type: string
        required: false
        default: ""
      shipctl_version:
        description: "npm dist-tag or semver for @elmundi/ship-cli. Default: latest."
        type: string
        required: false
        default: "latest"
      node_version:
        description: "Node.js major version for the runner"
        type: string
        required: false
        default: "20"
      dry_run:
        description: "Resolve the lane but neither call the callback nor write the idempotency marker."
        type: boolean
        required: false
        default: false
      offline:
        description: "Do not talk to the methodology API; read patterns from the local .ship/cache."
        type: boolean
        required: false
        default: false
      ship_run_id:
        description: "Pipeline-run id the callback should report against (set by Ship dispatch)."
        type: string
        required: false
        default: ""
      ship_callback_url:
        description: "Ship callback URL (set by Ship dispatch)."
        type: string
        required: false
        default: ""
      upload_prompt:
        description: "Upload the rendered prompt as a workflow artifact named `ship-prompt`."
        type: boolean
        required: false
        default: true
    secrets:
      SHIP_API_TOKEN:
        description: "Methodology API token (optional; required for private patterns / callbacks)."
        required: false
      SHIP_API_BASE:
        description: "Ship API origin for shipctl (e.g. https://api.example.com). Wizard seeds this from SHIP_PUBLIC_URL."
        required: false
      SHIP_RUN_TOKEN:
        description: "Short-lived bearer token Ship issued when dispatching this run."
        required: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # plan: read .ship/config.yml, emit a matrix of runnable entries.
  #
  # Matrix entry shape (JSON): {"pattern": "<id|empty>", "fanout": "<mode>"}
  #   - fanout=matrix (default): one entry per pattern, each with `pattern`
  #     set so the run job calls `shipctl run --lane X --pattern <id>`.
  #   - fanout=sequential|concurrent: a single entry with `pattern: ""`
  #     and `fanout` set — the run job calls `shipctl run --lane X --fanout <mode>`
  #     and shipctl iterates the patterns list itself.
  # Single-pattern lanes always collapse to one matrix entry regardless
  # of fanout, so the workflow shape is identical for them.
  # ---------------------------------------------------------------------
  plan:
    name: "ship plan --lane ${{ inputs.lane }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      patterns: ${{ steps.plan.outputs.patterns }}
      fanout: ${{ steps.plan.outputs.fanout }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install shipctl
        run: npm install -g @elmundi/ship-cli@${{ inputs.shipctl_version }}

      - name: Resolve patterns + fanout
        id: plan
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          JSON=$(shipctl lanes list --json)
          ROW=$(echo "$JSON" | jq -c --arg lane "$LANE" '.lanes[] | select(.lane == $lane)')
          if [ -z "$ROW" ] || [ "$ROW" = "null" ]; then
            echo "::error::lane '$LANE' not declared in .ship/config.yml"
            exit 1
          fi
          PATTERNS=$(echo "$ROW" | jq -c '.patterns // []')
          FANOUT=$(echo "$ROW" | jq -r '.fanout // "matrix"')
          N=$(echo "$PATTERNS" | jq 'length')
          if [ "$N" -lt 1 ]; then
            echo "::error::lane '$LANE' declares no patterns"
            exit 1
          fi

          if [ "$FANOUT" = "matrix" ] && [ "$N" -gt 1 ]; then
            # One runner per pattern.
            MATRIX=$(echo "$PATTERNS" | jq -c '[.[] | {pattern: ., fanout: "matrix"}]')
          elif [ "$N" -gt 1 ]; then
            # Single runner, shipctl iterates internally.
            MATRIX=$(jq -cn --arg fanout "$FANOUT" '[{pattern: "", fanout: $fanout}]')
          else
            # Single-pattern lane: one matrix entry with the primary pattern.
            # We set pattern="" so the run step falls back to the lane's
            # implicit single pattern (shipctl handles this naturally).
            MATRIX='[{"pattern": "", "fanout": "matrix"}]'
          fi

          echo "patterns=$PATTERNS" >> "$GITHUB_OUTPUT"
          echo "fanout=$FANOUT"     >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX"     >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo "- lane: \`$LANE\`"
            echo "- patterns: $(echo "$PATTERNS" | jq -r '. | join(", ")')"
            echo "- fanout: $FANOUT"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # run: one matrix job per entry emitted by plan.
  #
  # Each entry is self-contained: it installs shipctl, executes
  # `shipctl run` with the entry's pattern/fanout overrides, and
  # publishes its per-job outcome via the step outputs. The aggregate
  # job below reads these via `needs.run.result` (which is the
  # worst-case conclusion across the matrix).
  # ---------------------------------------------------------------------
  run:
    name: "ship run --lane ${{ inputs.lane }} (pattern=${{ matrix.entry.pattern }} fanout=${{ matrix.entry.fanout }})"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One failing pattern shouldn't cancel the rest — audit lanes
      # need the QA review even if the security review flakes.
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install shipctl
        run: npm install -g @elmundi/ship-cli@${{ inputs.shipctl_version }}

      - name: Resolve trigger
        id: trigger
        env:
          OVERRIDE: ${{ inputs.trigger }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            echo "value=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            case "$EVENT" in
              workflow_dispatch) echo "value=manual" >> "$GITHUB_OUTPUT" ;;
              schedule)          echo "value=schedule" >> "$GITHUB_OUTPUT" ;;
              *)                 echo "value=event" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: shipctl run
        id: run
        env:
          SHIP_API_TOKEN: ${{ secrets.SHIP_API_TOKEN }}
          SHIP_API_BASE: ${{ secrets.SHIP_API_BASE }}
          SHIP_RUN_TOKEN: ${{ secrets.SHIP_RUN_TOKEN }}
          SHIP_RUN_ID: ${{ inputs.ship_run_id }}
          # Per-matrix-entry we suppress the callback: the aggregate
          # job below sends exactly one rollup callback per lane run
          # so Ship sees one succeeded/failed result per dispatch.
          MATRIX_PATTERN: ${{ matrix.entry.pattern }}
          MATRIX_FANOUT:  ${{ matrix.entry.fanout }}
        run: |
          set -euo pipefail
          mkdir -p .ship/run-output
          ARGS=(run --lane "${{ inputs.lane }}" --trigger "${{ steps.trigger.outputs.value }}")
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          [ "${{ inputs.offline }}" = "true" ] && ARGS+=(--offline)
          [ -n "${MATRIX_PATTERN:-}" ] && ARGS+=(--pattern "$MATRIX_PATTERN")
          [ -n "${MATRIX_FANOUT:-}"  ] && ARGS+=(--fanout  "$MATRIX_FANOUT")
          [ -n "${SHIP_RUN_ID:-}"    ] && ARGS+=(--ship-run-id "$SHIP_RUN_ID")

          # Stream stdout (the rendered prompt) into an artifact file; the
          # agent step (or a human) consumes it downstream. stderr carries
          # the `# ship: lane=… agent.provider=…` banner and warnings —
          # tee it too so the GH Actions log stays self-describing.
          set +e
          shipctl "${ARGS[@]}" \
            1> .ship/run-output/prompt.md \
            2> .ship/run-output/shipctl.log
          STATUS=$?
          set -e

          cat .ship/run-output/shipctl.log >&2 || true
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::shipctl run exited with $STATUS"
            exit "$STATUS"
          fi

      - name: Upload prompt artifact
        if: ${{ inputs.upload_prompt && (success() || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          # Matrix entries share a lane id so we disambiguate by pattern
          # when present; single-pattern and non-matrix fan-out runs
          # collapse to `ship-prompt-<lane>` for backward compatibility.
          name: ship-prompt-${{ inputs.lane }}${{ matrix.entry.pattern != '' && format('-{0}', matrix.entry.pattern) || '' }}
          path: .ship/run-output/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # aggregate: exactly one callback per lane dispatch.
  #
  # Ship's pipeline_run is lane-scoped, not pattern-scoped, so we fold
  # the matrix results into a single succeeded/failed callback. If
  # any matrix job failed we report fail; the per-pattern prompts
  # live on the workflow's artifacts for post-mortem review.
  # ---------------------------------------------------------------------
  aggregate:
    name: "ship aggregate --lane ${{ inputs.lane }}"
    if: ${{ always() && inputs.ship_callback_url != '' }}
    needs: [plan, run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install shipctl
        run: npm install -g @elmundi/ship-cli@${{ inputs.shipctl_version }}

      - name: Report rollup to Ship
        env:
          SHIP_RUN_ID: ${{ inputs.ship_run_id }}
          SHIP_CALLBACK_URL: ${{ inputs.ship_callback_url }}
          SHIP_RUN_TOKEN: ${{ secrets.SHIP_RUN_TOKEN }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_RESULT: ${{ needs.run.result }}
          PLAN_PATTERNS: ${{ needs.plan.outputs.patterns }}
          PLAN_FANOUT: ${{ needs.plan.outputs.fanout }}
        run: |
          set -euo pipefail
          # `needs.run.result` is the worst-case over the matrix:
          #   success → every pattern succeeded
          #   failure → ≥1 pattern failed (or plan failed)
          #   cancelled / skipped — forward verbatim.
          case "$RUN_RESULT" in
            success)
              CB=ok
              SUMMARY="Ship lane ${{ inputs.lane }} completed ($PLAN_FANOUT over $PLAN_PATTERNS)."
              ;;
            failure|cancelled|skipped|*)
              CB=fail
              SUMMARY="Ship lane ${{ inputs.lane }} $RUN_RESULT ($PLAN_FANOUT over $PLAN_PATTERNS)."
              ;;
          esac
          shipctl callback --status "$CB" \
            --summary "$SUMMARY" \
            --metric "lane_id=${{ inputs.lane }}" \
            --metric "fanout=$PLAN_FANOUT" \
            --metric "patterns=$(echo "$PLAN_PATTERNS" | jq -r '. | join(",")')" \
            --metric "gh_workflow_run_id=${{ github.run_id }}" \
            --metric "gh_html_url=$GH_RUN_URL" \
            --metric "gh_event=${{ github.event_name }}" || true
