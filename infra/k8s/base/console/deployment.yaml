apiVersion: apps/v1
kind: Deployment
metadata:
  name: ship-console
  labels:
    app.kubernetes.io/name: ship-console
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  # ``maxSurge: 0`` — same rationale as ship-server: cluster CPU is
  # tight, never spawn a 3rd pod during rolling update.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ship-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ship-console
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ship-console
          image: dekus/ship-console:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: SHIP_API_URL
              # In-cluster DNS — console talks to backend over ClusterIP.
              value: http://ship-server.ship.svc.cluster.local
            - name: SENTRY_SERVICE_NAME
              value: ship-console
          envFrom:
            - secretRef:
                name: ship-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
