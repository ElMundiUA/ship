apiVersion: apps/v1
kind: Deployment
metadata:
  name: ship-server
  labels:
    app.kubernetes.io/name: ship-server
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ship-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ship-server
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: ship-server
          image: dekus/ship-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: SENTRY_SERVICE_NAME
              value: ship-server
          envFrom:
            - secretRef:
                name: ship-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
