apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ship

resources:
  - namespace.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - console/deployment.yaml
  - console/service.yaml
  - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: ship
