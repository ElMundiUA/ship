name: Ship · Bootstrap repository knowledge

on:
  push:
    paths:
      - ".ship/config.yml"
      - ".ship/state/wizard-seed.v2.json"
      - ".github/workflows/ship-bootstrap.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ship-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap_knowledge:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check wizard seed marker
        id: marker
        run: |
          if [ -f ".ship/state/wizard-seed.v2.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.marker.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shipctl
        if: steps.marker.outputs.present == 'true'
        run: npm install -g @elmundi/ship-cli@latest

      - name: Open generated knowledge PR
        if: steps.marker.outputs.present == 'true'
        env:
          SHIP_API_TOKEN: ${{ secrets.SHIP_API_TOKEN }}
          SHIP_WORKSPACE_API_BASE: ${{ secrets.SHIP_API_BASE }}
          SHIP_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shipctl knowledge bootstrap --repo "$SHIP_REPO"
