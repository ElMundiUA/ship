name: Ship · Scheduled SDLC lane
# Starter workflow for the `daily_standup` / retro lane.
# Runs on a cron (default 09:00 UTC) and via dashboard "Run now"
# (workflow_dispatch). The reporting contract matches pr-and-ci-gate.
#
# Note: `schedule` runs have **no** `workflow_dispatch` inputs — the
# "Report back to Ship" step is skipped unless you add a repository
# secret–based path later. Dashboard "Run now" supplies the callback.

on:
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: "Ship pipeline_run id we should report against"
        required: true
      ship_callback_url:
        description: "URL Ship is listening on for the result callback"
        required: true
      ship_run_token:
        description: "Short-lived bearer token Ship issued for this run"
        required: true
  schedule:
    - cron: "0 9 * * 1-5"

permissions:
  contents: read

jobs:
  sdlc_lane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shipctl
        run: npm install -g @elmundi/ship-cli@latest

      - name: Run scheduled retro lane
        id: lane
        run: |
          set -euo pipefail
          set +e
          shipctl run --lane daily_standup --trigger schedule --json > /tmp/ship-sdlc.json 2> /tmp/ship-sdlc.err
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            summary="$(tr '\n' ' ' < /tmp/ship-sdlc.err | cut -c1-500)"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "summary=${summary:-Scheduled SDLC lane failed}" >> "$GITHUB_OUTPUT"
            cat /tmp/ship-sdlc.err >&2
            exit "$code"
          fi

          status="$(jq -r '.status // empty' /tmp/ship-sdlc.json)"
          reason="$(jq -r '.reason // empty' /tmp/ship-sdlc.json)"
          if [ "$status" = "noop" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "summary=Scheduled SDLC lane did not execute: ${reason}" >> "$GITHUB_OUTPUT"
            cat /tmp/ship-sdlc.json
            exit 1
          fi

          echo "status=succeeded" >> "$GITHUB_OUTPUT"
          echo "summary=Scheduled SDLC lane completed" >> "$GITHUB_OUTPUT"

      - name: Report back to Ship
        if: always() && inputs.ship_callback_url != ''
        env:
          SHIP_RUN_ID: ${{ inputs.ship_run_id }}
          SHIP_CALLBACK_URL: ${{ inputs.ship_callback_url }}
          SHIP_RUN_TOKEN: ${{ inputs.ship_run_token }}
          GATE_STATUS: ${{ steps.lane.outputs.status || 'failed' }}
          GATE_SUMMARY: ${{ steps.lane.outputs.summary || 'Scheduled SDLC lane failed before reporting' }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CB=failed
          if [ "$GATE_STATUS" = "succeeded" ]; then CB=ok; fi
          shipctl callback --status "$CB" \
            --summary "$GATE_SUMMARY" \
            --metric "gh_workflow_run_id=$GH_RUN_ID" \
            --metric "gh_html_url=$GH_RUN_URL"
