# Generated by Ship — install bundle
# Learn more: https://app.ship.elmundi.com
preset: default
version: 2
shipctl_min: 0.12.0
repo: ElMundiUA/ship
api:
  base_url: "https://ship.elmundi.com"
  channel: stable
  ttl_hours: 24
  offline_ok: true
stack:
  tracker: none
  ci: gh-actions
  agents: []
  language: multi
agent:
  default: {}
  overrides: {}
process:
  id: development
  name: Development Process
  primary: true
  states:
  - id: task_intake
    name: Intake
    state: planning
    specialist:
      id: intake
      name: Intake specialist
    instructions: Clarify the request, collect missing context, and decide whether the
      task is ready for requirements.
  - id: ba_requirements
    name: Requirements
    state: planning
    specialist:
      id: business_analyst
      name: Business analyst
    instructions: Turn the request into acceptance criteria, constraints, risks, and
      open questions.
  - id: dev_implementation
    name: Implementation
    state: executing
    specialist:
      id: developer
      name: Developer
    instructions: Implement the change, update tests and documentation, and prepare
      the work for review.
  - id: qa_manual
    name: Quality Review
    state: executing
    specialist:
      id: qa_engineer
      name: QA engineer
    instructions: Validate acceptance criteria, edge cases, and user-facing quality
      before release.
  - id: pr_review
    name: Final Review
    state: reviewing
    specialist:
      id: review_owner
      name: Review owner
    instructions: Review the completed work for correctness, maintainability, scope,
      and release readiness.
  transitions:
  - from: task_intake
    to: ba_requirements
  - from: ba_requirements
    to: dev_implementation
  - from: dev_implementation
    to: qa_manual
  - from: qa_manual
    to: pr_review
  routines:
    security_review:
      name: Security Review
      enabled: true
      trigger:
        type: schedule
        cron: 0 6 * * *
        window: 30m
        catchup: latest
      pattern: role-security-officer
    daily:
      name: Daily
      enabled: true
      trigger:
        type: schedule
        cron: 0 9 * * *
        window: 30m
        catchup: latest
      pattern: flow-daily-retro
    tech_review:
      name: Tech Review
      enabled: true
      trigger:
        type: schedule
        cron: 0 12 * * *
        window: 30m
        catchup: latest
      pattern: role-tech-architect
    qa_review:
      name: Qa Review
      enabled: true
      trigger:
        type: schedule
        cron: 0 15 * * *
        window: 30m
        catchup: latest
      pattern: role-qa-architect
    retro:
      name: Retro
      enabled: true
      trigger:
        type: schedule
        cron: 0 18 * * *
        window: 30m
        catchup: latest
      pattern: flow-learning-capture
    healthcheck:
      name: Healthcheck
      enabled: true
      trigger:
        type: schedule
        cron: 0 */2 * * *
        window: 30m
        catchup: latest
      pattern: op-workflow-self-heal
