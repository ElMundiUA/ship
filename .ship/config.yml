# Generated by Ship — install bundle
# Learn more: https://app.ship.elmundi.com
preset: default
version: 2
shipctl_min: 0.12.0
repo: ElMundiUA/ship
api:
  base_url: "https://ship.elmundi.com"
  channel: stable
  ttl_hours: 24
  offline_ok: true
stack:
  tracker: none
  ci: gh-actions
  agents: []
  language: multi
agent:
  default: {}
  overrides: {}
process:
  id: development
  name: Development Process
  primary: true
  gates: after_pr
  states:
  - id: task_intake
    name: Intake
    state: planning
    specialist:
      id: intake
      name: Intake
    instructions: "Classify + produce the full impl-grade spec in one pass. Output sections\
      \ depend on classification \u2014 features use Problem / Goal / Feature description\
      \ / User stories / AC / Edge cases / Scope / Non-goals / Impacted components /\
      \ Technical notes / Test plan / Risks; bugs use Summary / Steps / Expected / Actual\
      \ / Environment / Severity / Scope / Suspect area / AC for fix. The legacy ``ba_requirements``\
      \ stage was folded in here \u2014 same context-load was feeding two LLM calls\
      \ in a row, producing overlapping output shapes."
  - id: tech_arch_plan
    name: Tech architecture
    state: planning
    specialist:
      id: tech-architect
      name: Tech architect
    instructions: "Plan the architecture of the change \u2014 components touched, contracts,\
      \ risk + rollback. Design only, no code."
  - id: qa_arch_plan
    name: Test architecture
    state: planning
    specialist:
      id: qa-architect
      name: QA architect
    instructions: "Design the test coverage strategy \u2014 unit / integration / e2e\
      \ split, fixtures, edge cases. Design only, no test code."
  - id: dev_implementation
    name: Implementation
    state: executing
    specialist:
      id: developer
      name: Developer
    instructions: Implement the change against the architecture plan, run the relevant
      gates, open the PR.
  - id: qa_manual
    name: Manual QA
    state: executing
    specialist:
      id: qa-engineer
      name: QA engineer
    instructions: Walk the manual test plan against the open PR; report defects without
      fixing them.
  - id: qa_automation
    name: Test automation
    state: executing
    specialist:
      id: qa-automation
      name: QA automation
    instructions: Add automated tests anchored to the architect's test plan so the regression
      sticks.
  - id: code_review
    name: Code review
    state: reviewing
    specialist:
      id: reviewer
      name: Reviewer
    instructions: "Final agent-side review \u2014 comments only, never pushes commits,\
      \ never approves. Flags blockers before the human merger sees the PR."
  transitions:
  - from: task_intake
    to: tech_arch_plan
  - from: tech_arch_plan
    to: qa_arch_plan
  - from: qa_arch_plan
    to: dev_implementation
  - from: dev_implementation
    to: qa_manual
  - from: qa_manual
    to: qa_automation
  - from: qa_automation
    to: code_review
  routines:
    daily:
      name: Daily
      enabled: true
      trigger:
        type: schedule
        cron: 0 9 * * *
        window: 30m
        catchup: latest
      specialist: daily-retro
    retro:
      name: Retro
      enabled: true
      trigger:
        type: schedule
        cron: 0 18 * * *
        window: 30m
        catchup: latest
      specialist: learning-capture
    healthcheck:
