# Generated by Ship — install bundle
# Learn more: https://app.ship.elmundi.com
preset: default
version: 2
shipctl_min: 0.12.0
repo: ElMundiUA/ship
api:
  base_url: "https://ship.elmundi.com"
  channel: stable
  ttl_hours: 24
  offline_ok: true
stack:
  tracker: none
  ci: gh-actions
  agents: []
  language: multi
agent:
  default: {}
  overrides: {}
process:
  id: development
  name: Development Process
  primary: true
  gates: after_pr
  states:
  - id: planning
    name: Planning
    state: planning
    specialist:
      id: planning
      name: Planning bundle
    instructions: One run produces Brief + Architecture + Test plan. Classifies the
      ticket (feature/bug/refactor/infra/improvement), writes the impl-grade spec, appends
      the architecture plan, then the test plan. All four phases share one context load
      so we don't pay for the same ticket-body fetch four times.
  - id: dev_implementation
    name: Implementation
    state: executing
    specialist:
      id: developer
      name: Developer
    instructions: Implement the change against the architecture plan, run the relevant
      gates, open the PR.
  - id: validation
    name: Validation
    state: executing
    specialist:
      id: validation
      name: Validation bundle
    instructions: "One run against the open PR. Phase 1 walks the test plan manually\
      \ + probes for unlisted defects; Phase 2 adds the automated regression suite on\
      \ the same branch. Defects in Phase 1 stop the bundle with outcome=blocked \u2014\
      \ automation never bakes in broken behaviour."
  - id: code_review
    name: Code review
    state: reviewing
    specialist:
      id: reviewer
      name: Reviewer
    instructions: "Final agent-side review \u2014 comments only, never pushes commits,\
      \ never approves. Flags blockers before the human merger sees the PR."
  transitions:
  - from: planning
    to: dev_implementation
  - from: dev_implementation
    to: validation
  - from: validation
    to: code_review
  routines:
    daily:
      name: Daily
      enabled: true
      trigger:
        type: schedule
        cron: 0 9 * * *
        window: 30m
        catchup: latest
      specialist: daily-retro
    retro:
      name: Retro
      enabled: true
      trigger:
        type: schedule
        cron: 0 18 * * *
        window: 30m
        catchup: latest
      specialist: learning-capture
    healthcheck:
      name: Healthcheck
      enabled: true
      trigger:
        type: schedule
        cron: 0 */2 * * *
        window: 30m
        catchup: latest
      specialist: workflow-self-heal
    tech_review:
      name: Tech Review
      enabled: true
      trigger:
        type: schedule
        cron: 0 12 * * *
        window: 30m
        catchup: latest
      specialist: tech-reviewer
    qa_review:
      name: Qa Review
      enabled: true
      trigger:
        type: schedule
        cron: 0 15 * * *
        window: 30m
        catchup: latest
      specialist: qa-reviewer
    security_review:
      name: Security Review
      enabled: true
      trigger:
        type: schedule
        cron: 0 6 * * *
        window: 30m
        catchup: latest
      specialist: security-officer
    process_review:
      name: Process Review
      enabled: true
      trigger:
        type: schedule
        cron: 0 16 * * *
        window: 30m
        catchup: latest
      specialist: process-reviewer
    intake:
      name: Intake
      enabled: true
      trigger:
        type: schedule
        cron: '*/30 * * * *'
        window: 30m
        catchup: latest
      specialist: intake
      fsm_stage: task_intake
      pipeline_priority: 10
    tech_arch_plan:
