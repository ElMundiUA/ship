version: 2
shipctl_min: "0.12.0"
preset: monorepo
repo: ElMundiUA/ship
api:
  base_url: https://ship.elmundi.com
  channel: stable
stack:
  tracker: linear
  ci: gh-actions
  preset: monorepo
  language: multi
agent:
  default:
    provider: cursor-cloud
  overrides: {}
lanes:
  seed_knowledge_starters:
    kind: once
    pattern: seed-knowledge-starters
    idempotency:
      key: seed-knowledge-starters.v1
      store: file
      reset_on: version-change
  pr_review:
    kind: event
    pattern: catalog-a5-pr-self-review
    on: pull_request
    permissions:
      contents: read
      pull-requests: write
  daily_standup:
    kind: schedule
    pattern: catalog-a13-daily-retro
    cron: "0 9 * * 1-5"
  tech_debt:
    kind: schedule
    pattern: catalog-a12-learning
    cron: "0 10 * * 1"
  self_heal:
    kind: event
    pattern: cloud-workflow-self-heal
    on: workflow_run
    when:
      conclusion: failure
    permissions:
      contents: read
      actions: read
      pull-requests: write
