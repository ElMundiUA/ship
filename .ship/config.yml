        catchup: latest
      specialist: security-officer
    process_review:
      name: Process Review
      enabled: true
      trigger:
        type: schedule
        cron: 0 16 * * *
        window: 30m
        catchup: latest
      specialist: process-reviewer
    intake:
      name: Intake
      enabled: true
      trigger:
        type: schedule
        cron: '*/30 * * * *'
        window: 30m
        catchup: latest
      specialist: intake
      fsm_stage: task_intake
      pipeline_priority: 10
    tech_arch_plan:
